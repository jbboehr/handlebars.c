name: docker

on:
    push:
        branches:
            - master
            - develop
        tags:
            - "v*"

env:
    DEFAULT_IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.ref_name == 'master' && 'latest' || 'develop' }}
    ALPINE_IMAGE_TAG: ${{ github.ref_type == 'tag' && format('{0}-alpine', github.ref_name) || github.ref_name == 'master' && 'alpine' || 'develop-alpine' }}
    DEBIAN_IMAGE_TAG: ${{ github.ref_type == 'tag' && format('{0}-debian', github.ref_name) || github.ref_name == 'master' && 'debian' || 'develop-debian' }}
    FEDORA_IMAGE_TAG: ${{ github.ref_type == 'tag' && format('{0}-fedora', github.ref_name) || github.ref_name == 'master' && 'fedora' || 'develop-fedora' }}

jobs:
    publish_alpine_docker_hub:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Publish to Docker Hub
              uses: docker/build-push-action@v7
              with:
                  file: .github/alpine.Dockerfile
                  push: true
                  tags: |
                    jbboehr/handlebars.c:${{ env.DEFAULT_IMAGE_TAG }}
                    jbboehr/handlebars.c:${{ env.ALPINE_IMAGE_TAG }}

    publish_alpine_gh_pkg:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish to GitHub Packages
              uses: docker/build-push-action@v7
              with:
                  file: .github/alpine.Dockerfile
                  push: true
                  tags: |
                    ghcr.io/jbboehr/handlebars.c/handlebarsc:${{ env.DEFAULT_IMAGE_TAG }}
                    ghcr.io/jbboehr/handlebars.c/handlebarsc:${{ env.ALPINE_IMAGE_TAG }}

    publish_debian_docker_hub:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Publish to Docker Hub
              uses: docker/build-push-action@v7
              with:
                  file: .github/debian.Dockerfile
                  push: true
                  tags: "jbboehr/handlebars.c:${{ env.DEBIAN_IMAGE_TAG }}"

    publish_debian_gh_pkg:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish to GitHub Packages
              uses: docker/build-push-action@v7
              with:
                  file: .github/debian.Dockerfile
                  push: true
                  tags: "ghcr.io/jbboehr/handlebars.c/handlebarsc:${{ env.DEBIAN_IMAGE_TAG }}"

    publish_fedora_docker_hub:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_TOKEN }}
            - name: Publish to Docker Hub
              uses: docker/build-push-action@v7
              with:
                  file: .github/fedora.Dockerfile
                  push: true
                  tags: "jbboehr/handlebars.c:${{ env.FEDORA_IMAGE_TAG }}"

    publish_fedora_gh_pkgs:
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.repository_owner }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish to GitHub Packages
              uses: docker/build-push-action@v7
              with:
                  file: .github/fedora.Dockerfile
                  push: true
                  tags: "ghcr.io/jbboehr/handlebars.c/handlebarsc:${{ env.FEDORA_IMAGE_TAG }}"
