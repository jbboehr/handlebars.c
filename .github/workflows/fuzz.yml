name: fuzz

on:
    pull_request:
        branches:
            - master
    schedule:
        - cron: "17 4 * * 0"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: fuzz-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    template:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '900' || '60' }}
        steps:
            - uses: actions/checkout@v6

            - name: Install packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y autoconf automake clang-18 libclang-rt-18-dev libtalloc-dev libtool m4 make pkg-config

            - name: Restore generated corpus
              uses: actions/cache@v5
              with:
                  path: fuzz-corpus
                  key: fuzz-template-${{ runner.os }}-${{ github.run_id }}
                  restore-keys: |
                      fuzz-template-${{ runner.os }}-

            - name: Create configure
              run: autoreconf -i

            - name: Configure fuzz target
              env:
                  CC: clang-18
                  CFLAGS: "-O1 -g"
              run: >-
                  ./configure
                  --enable-fuzzing
                  --disable-bats
                  --disable-bison
                  --disable-check
                  --disable-flex
                  --disable-gperf
                  --disable-hardening
                  --disable-json
                  --disable-lmdb
                  --disable-pcre
                  --disable-pthread
                  --disable-shared
                  --disable-subunit
                  --disable-testing-exports
                  --disable-valgrind
                  --disable-yaml
                  --without-handlebars-spec
                  --without-mustache-spec

            - name: Build fuzz target
              run: make -j2

            - name: Run template fuzzer
              env:
                  ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
                  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
              run: |
                  mkdir -p fuzz-artifacts fuzz-corpus
                  ./fuzz/fuzz_template \
                      fuzz-corpus \
                      fuzz/corpus/template \
                      -artifact_prefix=fuzz-artifacts/ \
                      -dict=fuzz/handlebars.dict \
                      -max_len=65536 \
                      -max_total_time="$FUZZ_SECONDS" \
                      -timeout=10

            - name: Upload crash artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: fuzz-artifacts-${{ github.run_id }}
                  path: fuzz-artifacts/
                  if-no-files-found: ignore
