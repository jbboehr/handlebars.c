name: ci

on:
    push:
        branches:
            - master
            - dev-1.x
            - develop
    pull_request:
        branches:
            - master

jobs:
    linux:
        runs-on: ${{ matrix.DISTRO }}
        strategy:
            fail-fast: false
            matrix:
                DISTRO:
                    - "ubuntu-22.04"
                    - "ubuntu-24.04"
                CC:
                    - "gcc"
                    - "clang"
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: sudo apt-get install -y autotools-dev autoconf automake bats libtool m4 make pkg-config check libpcre2-dev libtalloc-dev libsubunit-dev lcov libjson-c-dev liblmdb-dev libyaml-dev ${{ matrix.CC }}
            - run: autoreconf -i
            - run: ./configure
              env:
                  CC: ${{ matrix.CC }}
                  # json-c undeprecated json_object_object_get, but the version in xenial
                  # is too old, so let's silence deprecated warnings. le sigh.
                  CFLAGS: "-Wno-deprecated-declarations -Wno-error=deprecated-declarations"
            - run: make
            - run: make check
            - run: make distcheck
            - name: dump logs
              if: ${{ failure() }}
              run: |
                  find tests -name "*.log" -print0 2>/dev/null |
                  while IFS= read -r -d '' log; do
                      echo "-- START ${log}";
                      cat "${log}";
                      echo "-- END";
                  done

    linux_committed_autotools:
        name: linux (committed Autotools outputs)
        runs-on: ubuntu-24.04
        env:
            ACLOCAL: "false"
            AUTOCONF: "false"
            AUTOHEADER: "false"
            AUTOMAKE: "false"
            RE2C: "no"
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y bats check gcc libjson-c-dev liblmdb-dev libpcre2-dev libsubunit-dev libtalloc-dev libyaml-dev make pkg-config
            - name: Normalize generated-file timestamps
              run: |
                  touch \
                      aclocal.m4 \
                      configure \
                      config.h.in \
                      src/handlebars_config.h.in \
                      Makefile.in \
                      bench/Makefile.in \
                      bin/Makefile.in \
                      doc/Makefile.in \
                      fuzz/Makefile.in \
                      src/Makefile.in \
                      tests/Makefile.in \
                      build/* \
                      src/handlebars.lex.c \
                      src/handlebars.lex.h \
                      src/handlebars.tab.c \
                      src/handlebars.tab.h \
                      src/handlebars_helpers_ht.h \
                      src/handlebars_scanners.c
            - name: Configure without regenerating Autotools outputs
              run: ./configure --disable-bison --disable-flex --disable-gperf --enable-compile-warnings=yes
            - run: make -j2
            - run: make check
            - name: Verify tracked files were not regenerated
              run: git diff --exit-code
            - name: dump logs
              if: ${{ failure() }}
              run: |
                  find tests -name "*.log" -print0 2>/dev/null |
                  while IFS= read -r -d '' log; do
                      echo "-- START ${log}";
                      cat "${log}";
                      echo "-- END";
                  done

    linux_sanitizers:
        name: linux (clang sanitizers)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            CC: clang-18
            CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"
            LDFLAGS: "-fsanitize=address,undefined"
            # Keep Check in-process so LeakSanitizer sees fixture cleanup.
            CK_FORK: "no"
            ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
            UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y autotools-dev autoconf automake bats check clang-18 libclang-rt-18-dev libjson-c-dev liblmdb-dev libpcre2-dev libsubunit-dev libtalloc-dev libtool libyaml-dev m4 make pkg-config
            - run: autoreconf -i
            - run: ./configure --disable-hardening --disable-valgrind
            - run: make -j2
            - run: make check
            - name: dump logs
              if: ${{ failure() }}
              run: |
                  find tests -name "*.log" -print0 2>/dev/null |
                  while IFS= read -r -d '' log; do
                      echo "-- START ${log}";
                      cat "${log}";
                      echo "-- END";
                  done

    linux_coverage:
        runs-on: ${{ matrix.DISTRO }}
        strategy:
            fail-fast: false
            matrix:
                DISTRO:
                    - "ubuntu-22.04"
                    - "ubuntu-24.04"
                CC:
                    - "gcc"
                    # - "clang"
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: sudo apt-get install -y autotools-dev autoconf automake bats libtool m4 make pkg-config check libpcre2-dev libtalloc-dev libsubunit-dev lcov libjson-c-dev liblmdb-dev libyaml-dev lcov ${{ matrix.CC }}
            - run: autoreconf -i
            - run: ./configure --enable-code-coverage
              env:
                  CC: ${{ matrix.CC }}
                  # json-c undeprecated json_object_object_get, but the version in xenial
                  # is too old, so let's silence deprecated warnings. le sigh.
                  CFLAGS: "-Wno-deprecated-declarations -Wno-error=deprecated-declarations"
            - run: make
            - run: make check
            - run: make code-coverage-capture
            - name: Coveralls
              #   if: ${{ matrix.COVERAGE == 'true' }}
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  path-to-lcov: ./handlebars-coverage.info
            - name: dump logs
              if: ${{ failure() }}
              run: |
                  find tests -name "*.log" -print0 2>/dev/null |
                  while IFS= read -r -d '' log; do
                      echo "-- START ${log}";
                      cat "${log}";
                      echo "-- END";
                  done

    linux_scanbuild:
        runs-on: ${{ matrix.DISTRO }}
        strategy:
            fail-fast: false
            matrix:
                DISTRO:
                    - "ubuntu-24.04"
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: sudo apt-get install -y autotools-dev autoconf automake bats libtool m4 make pkg-config check libpcre2-dev libtalloc-dev libsubunit-dev lcov libjson-c-dev liblmdb-dev libyaml-dev clang-tools html2text
            - run: autoreconf -i
            - run: scan-build ./configure
              env:
                  # json-c undeprecated json_object_object_get, but the version in xenial
                  # is too old, so let's silence deprecated warnings. le sigh.
                  CFLAGS: "-Wno-deprecated-declarations -Wno-error=deprecated-declarations"
            - run: scan-build -o scan-build make
            - name: check for issues
              run: |
                  if [ -n "$(find scan-build -name '*.html')" ]; then
                    echo "scan-build found potential issues"
                    find scan-build -name 'index.html' -print -exec html2text '{}' ';'
                    exit 1
                  fi
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: scan-build
                  path: scan-build

    build_osx_autotools_default_args:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive
            - name: Install packages
              run: brew install autoconf automake bats-core json-c libtool libyaml lmdb pkg-config talloc check lcov pcre2
            - name: create configure
              run: autoreconf -i
            - name: configure
              # disabling compiler warnings as error because of some weird issue with libtool and '-Wl,-fatal_warnings'
              run: ./configure --disable-bison --disable-flex --disable-gperf --enable-compile-warnings=yes
            - name: make
              run: make
            - name: make check
              run: make check
            - name: make distcheck
              run: make distcheck DISTCHECK_CONFIGURE_FLAGS="--disable-bison --disable-flex --disable-gperf --enable-compile-warnings=yes"
            - name: dump logs
              if: ${{ failure() }}
              run: |
                  find tests -name "*.log" -print0 2>/dev/null |
                  while IFS= read -r -d '' log; do
                      echo "-- START ${log}";
                      cat "${log}";
                      echo "-- END";
                  done

    nix-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v6
            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
            -   id: set-matrix
                name: Generate Nix Matrix
                run: |
                    set -Eeu
                    matrix="$(nix eval --json '.#githubActions.matrix')"
                    echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix:
        name: "nix (${{ matrix.name }})"
        runs-on: ${{ matrix.os }}
        needs: nix-matrix
        strategy:
            matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}
        steps:
            -   uses: actions/checkout@v6

            -   name: Set Up Build Cache
                uses: actions/cache@v6
                id: nix-cache
                with:
                    path: /tmp/nix-store.nar
                    key: nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.attr }}
                    restore-keys: |
                        nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ matrix.attr }}
                        nix-store.nar-${{ runner.os }}-${{ hashFiles('flake.lock') }}-
                        nix-store.nar-${{ runner.os }}-

            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"

            -   name: Import Nix Store Cache
                if: "steps.nix-cache.outputs.cache-hit == 'true'"
                run: |
                    nix-store --import < /tmp/nix-store.nar

            -   run: sudo sysctl -w kernel.perf_event_paranoid=1

            -   run: nix build -L ".#${{ matrix.attr }}"

            #            -   run: nix flake check -L

